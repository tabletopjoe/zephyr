      trailTouched.clear();
      const from = Math.max(0, now - TRAIL_LENGTH);
      const STEPS = 48; // samples across the swing — enough that the arc is smooth
      for (let k = 0; k <= STEPS; k++) {
        const u = from + (now - from) * (k / STEPS);
        const p = slashPose(attack.kind, attack.reverse, swingEase(u));
        const strength = (0.15 + 0.4 * (k / STEPS)) * fade; // brighter toward the blade
        // Walk out along the (curved) blade, marking its outer half.
        // (Where the blade was, measured from where her body is now.)
        let bx = p.hx + p.bx - pose.bx, by = p.hy + p.by - pose.by;
        const step = GLASS_BLADE * poseVal(p, "len") / 24;
        for (let j = 0; j < 24; j++) {
          const a = p.a - 0.6 * (j / 24);
          bx += Math.cos(a) * step;
          by += Math.sin(a) * step;
          if (j < 10) continue;
          const rx = bx * FIG_SCALE, ry = (by - FIG_PIVOT) * FIG_SCALE;
          const sx = Math.round(cx + rx * cos - ry * sin), sy = Math.round(cy + rx * sin + ry * cos);
          for (let oy = -1; oy <= 1; oy++) {
            for (let ox = -1; ox <= 1; ox++) {
              const x = sx + ox, y = sy + oy;
              if (x < 0 || x >= W || y < 0 || y >= H) continue;
              const i = y * W + x;
              if (trailTouched.has(i)) continue; // each pixel lit once, so overlaps don't pile up
              trailTouched.add(i);
              tintPx(i, TRAIL_LIGHT, strength);
            }
          }
        }
      }
    }

    // Slash marks: the "wound" each slash leaves on whatever's in front of
    // her — a long, nearly straight bright gash across the slash's
    // direction, as if cut into a layer just beyond her rather than traced
    // along the sword's swing. It's pointed at both ends and widest in the
    // middle, white with a pale blue rim. Its head races ahead of the blade
    // (in the slash's direction); once the swing's done it thins out and
    // shrinks away from its start. It stays where it was cut while she
    // lurches about. Each slash leaves its own, so quick slashes overlap.
    // Drawn under her, like the trail.
    //
    // Each kind's mark runs `from` → `to` (figure units, in its first
    // direction; the second direction runs it backward), with a slight
    // bow: how far, and which way, its middle bulges.
    const SLASH_WOUNDS = {
      horizontal: { from: { x: 48, y: -1.25 }, to: { x: -48, y: 12.25 }, bow: { x: 0, y: -4.5 } },
      vertical: { from: { x: 14.5, y: -35 }, to: { x: 5.5, y: 55 }, bow: { x: 4.5, y: 0 } },
    };
    const MARK_WIDTH = 5;      // at its widest, in figure units
    const MARK_FADE = 0.2;     // seconds it lingers after the swing
    const MARK_STEPS = 160;    // points along it — enough that it's solid, with no gaps
    const MARK_CORE = rgb("#ffffff"), MARK_EDGE = rgb("#9fe8ff");
    const slashMarks = [];
    const markTouched = new Set();

    function drawSlashMarks(t, cx, cy, cos, sin, body) {
      const pxStep = 0.5 / FIG_SCALE; // half a screen pixel, in figure units
      const rim = 1 / FIG_SCALE;      // the rim is a pixel wide
      for (let m = slashMarks.length - 1; m >= 0; m--) {
        const mark = slashMarks[m];
        const e = t - mark.start - SLASH_WINDUP;
        if (e < 0) continue;
        const gone = Math.max(0, e - SLASH_SWING) / MARK_FADE; // 0 … 1 through the fade
        if (gone >= 1) { slashMarks.splice(m, 1); continue; }
        const head = Math.min(1, e / (SLASH_SWING * 0.75)); // reaches the far end before the blade does
        const { from, to, bow } = SLASH_WOUNDS[mark.kind];
        const [A, B] = mark.reverse ? [to, from] : [from, to];
        markTouched.clear();
        for (let k = 0; k <= MARK_STEPS; k++) {
          const v = k / MARK_STEPS; // 0 at the start of the cut, 1 at its end
          if (v > head || v < gone) continue;
          // The point v of the way along, and the way the line runs there.
          const b = 4 * v * (1 - v), db = 4 - 8 * v;
          // (Measured from where her body is now, so it stays where it was cut.)
          const x = A.x + (B.x - A.x) * v + bow.x * b - body.bx, y = A.y + (B.y - A.y) * v + bow.y * b - body.by;
          const tx = B.x - A.x + bow.x * db, ty = B.y - A.y + bow.y * db;
          const tl = Math.hypot(tx, ty) || 1;
          const nx = -ty / tl, ny = tx / tl;
          // Widest in the middle, tapering to points.
          const half = MARK_WIDTH / 2 * Math.sin(Math.PI * v) ** 0.7 * (1 - gone);
          for (let d = -half; d <= half; d += pxStep) {
            const fx = x + nx * d, fy = y + ny * d;
            const rx = fx * FIG_SCALE, ry = (fy - FIG_PIVOT) * FIG_SCALE;
            const sx = Math.round(cx + rx * cos - ry * sin), sy = Math.round(cy + rx * sin + ry * cos);
            if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;
            const i = sy * W + sx;
            if (markTouched.has(i)) continue;
            markTouched.add(i);
            const edge = Math.abs(d) > half - rim; // a pale blue rim, white inside
            tintPx(i, edge ? MARK_EDGE : MARK_CORE, (edge ? 0.7 : 0.9) * (1 - gone * 0.5));
          }
        }
      }
    }

    // =====================================================================
    // 8. Controls.
    //    Throttle: hold ↑ or W to speed up, ↓ or S to slow down (all the way to a
    //    stop). The keys move the throttle; the boat's actual speed eases
    //    toward it, so it builds up and coasts down rather than jumping.
    //    Speeds are multiples of scene 2's (1× = TRIP_SECONDS per row).
    //    Steering: hold ← / → (or A / D) to turn the boat that way. The whole
    //    view swings — sun, clouds and waves together. Turning eases in and
    //    out, and needs way on: below 1× the boat turns more slowly, and a
    //    stopped boat only drifts round.
    //    M shows or hides the chart (section 9); F the frame-time readout
    //    (section 10).
    // =====================================================================
    const THROTTLE_MAX = 9; // top speed, as a multiple of scene 2's
    const THROTTLE_RATE = 1;  // how fast holding a key moves the throttle, per second
    const RESPONSE = 3;     // how quickly the speed catches up to the throttle (higher = snappier)
    const TURN_RATE = 12 * Math.PI / 180; // turning speed at full lock, at 1× and faster (12° a second)
    const STEER_FLOOR = 0.2;    // how much a stopped boat can still drift round (as if at 0.2× speed)
    const STEER_RESPONSE = 2.5; // how quickly turning starts and stops (higher = snappier)
    let throttle = 1, speed = 1;
    let turnRate = 0;             // current turning speed, radians per second (negative = left)
    let lastAdjusted = -Infinity; // when the throttle last moved — the speed bar shows for a while after
    const held = new Set();
    // The arrow keys, mirrored on W/A/S/D. Physical keys (e.code), not the
    // characters they type, so they work whatever Caps Lock is doing.
    const FASTER = ["ArrowUp", "KeyW"];
    const SLOWER = ["ArrowDown", "KeyS"];
    const LEFT = ["ArrowLeft", "KeyA"];
    const RIGHT = ["ArrowRight", "KeyD"];
    const CONTROL_KEYS = [...FASTER, ...SLOWER, ...LEFT, ...RIGHT];
    const anyHeld = (codes) => codes.some((c) => held.has(c));

    addEventListener("keydown", (e) => {
      if (CONTROL_KEYS.includes(e.code)) {
        held.add(e.code);
        e.preventDefault(); // don't scroll the page
      }
    });
    addEventListener("keydown", (e) => {
      if (e.code === "KeyM" && !e.repeat) showChart = !showChart;
      if (e.code === "KeyF" && !e.repeat) showFrameTime = !showFrameTime;
      if (e.code === "Space") {
        e.preventDefault(); // don't scroll the page
        if (!e.repeat) requestJump();
      }
    });
    addEventListener("keyup", (e) => held.delete(e.code));
    // Mouse: left click slashes horizontally, right click vertically (and
    // doesn't open the browser's menu).
    addEventListener("mousedown", (e) => {
      if (e.button === 0) requestSlash("horizontal");
      if (e.button === 2) requestSlash("vertical");
    });
    addEventListener("contextmenu", (e) => e.preventDefault());
    addEventListener("blur", () => held.clear()); // a key released while the window wasn't listening

    function updateThrottle(t, dt) {
      const step = THROTTLE_RATE * dt;
      let next = throttle;
      if (anyHeld(FASTER)) next += step;
      if (anyHeld(SLOWER)) next -= step; // holding both ways at once cancels out
      next = Math.min(THROTTLE_MAX, Math.max(0, next));
      if (next !== throttle) lastAdjusted = t;
      throttle = next;
      speed += (throttle - speed) * (1 - Math.exp(-RESPONSE * dt));
    }

    function updateSteering(dt) {
      const dir = (anyHeld(RIGHT) ? 1 : 0) - (anyHeld(LEFT) ? 1 : 0);
      const target = dir * TURN_RATE * Math.min(1, Math.max(speed, STEER_FLOOR));
      turnRate += (target - turnRate) * (1 - Math.exp(-STEER_RESPONSE * dt));
    }

    // A small speed bar in the bottom-left corner while you're adjusting
    // (and two seconds after): the fill is the current speed, the tick
    // marks 1×.
    const BAR_TRACK = rgb("#07102a"), BAR_FILL = rgb("#e6eef6"), BAR_TICK = rgb("#ff8a4c");
    function drawSpeedBar(t) {
      if (t - lastAdjusted > 2) return;
      const x0 = view.left + 4 * S, y0 = view.bottom - 7 * S, w = 40 * S, h = 3 * S;
      for (let y = y0 - 1; y <= y0 + h; y++) for (let x = x0 - 1; x <= x0 + w; x++) px(x, y, BAR_TRACK);
      const filled = Math.round((speed / THROTTLE_MAX) * w);
      for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + filled; x++) px(x, y, BAR_FILL);
      const tick = x0 + Math.round(w / THROTTLE_MAX);
      for (let y = y0 - 1; y <= y0 + h; y++) px(tick, y, BAR_TICK);
    }

    // =====================================================================
    // 9. The map: a finite square of sea the boat moves around on.
    //    Positions are in metres, x running east and y running south (so
    //    north is up on the chart). Headings are compass bearings in
    //    radians: 0 north, π/2 east, π south, 3π/2 west.
    //
    //    The map wraps around: sail off one edge and you come back in at
    //    the opposite edge, still heading the same way.
    //
    //    The chart in the top-right corner shows the map: the edge, the
    //    water you've been close enough to see (filled in as you go — the
    //    start of "exploring"), and the boat with its heading.
    //
    //    The wind blows one way across the map, so which way the clouds
    //    drift depends on your heading.
    // =====================================================================
    const MAP_SIZE = 4000;              // metres each way (≈ 13 min to cross at 1×, 1½ min at full speed)
    const SPEED_1X = 5;                 // metres per second at 1× (about 10 knots)
    const SUN_BEARING = 1.5 * Math.PI;  // the sun sets due west
    const MOON_BEARING = 0.75 * Math.PI; // the moon hangs southeast
    const WIND_BEARING = 0;             // the wind blows north (rightward across the view when facing the sun)

    // How wide the view is: pixels of screen per radian of turn (about an
    // 80° field of view across the screen).
    const PX_PER_RAD = 229 * S;
    const wrapAngle = (a) => a - 2 * Math.PI * Math.floor((a + Math.PI) / (2 * Math.PI)); // into -π…π

    // Mid-sea, heading just south of the sunset, so the sun sits right of
    // straight ahead (at SUN_X) as in the earlier scenes.
    const boat = { x: MAP_SIZE / 2, y: MAP_SIZE / 2, heading: SUN_BEARING - (SUN_X - AHEAD_X) / PX_PER_RAD };

    // The unit vector a compass bearing points along.
    const forwardOf = (b) => ({ x: Math.sin(b), y: -Math.cos(b) });

    // Keeps a position on the map, wrapping off one edge onto the other.
    const wrapMap = (v) => ((v % MAP_SIZE) + MAP_SIZE) % MAP_SIZE;

    // Moves the boat along its heading (wrapping round at the edges) and
    // returns how far it moved.
    function moveBoat(dt) {
      const f = forwardOf(boat.heading);
      const dist = dt * speed * SPEED_1X;
      const moved = { x: f.x * dist, y: f.y * dist };
      boat.x = wrapMap(boat.x + moved.x);
      boat.y = wrapMap(boat.y + moved.y);
      return moved;
    }

    const CHART = 34 * S;                                    // the chart's size on screen, in pixels
    const chartX = () => view.right - CHART - 4 * S;         // top-right corner of what's visible
    const chartY = () => view.top + 4 * S;
    const SEEN_RADIUS = 250;                                 // metres around the boat that count as explored
    const seen = new Uint8Array(CHART * CHART);              // one flag per chart pixel
    const CHART_EDGE = rgb("#9d93c4"), CHART_DARK = rgb("#0e0c1a"), CHART_SEEN = rgb("#25497e");
    const CHART_BOAT = rgb("#ffd27a"), CHART_BOW = rgb("#fff6d8");
    let showChart = true;

    // Half this color, half whatever is already on screen there — so the
    // chart is see-through. (Halving each byte of both and adding them
    // averages all four channels at once.)
    function blendPx(x, y, color) {
      if (x < 0 || x >= W || y < 0 || y >= H) return;
      const i = y * W + x;
      buf[i] = (((buf[i] >>> 1) & 0x7f7f7f7f) + ((color >>> 1) & 0x7f7f7f7f)) | 0xff000000;
    }

    function markSeen() {
      const k = CHART / MAP_SIZE; // chart pixels per metre
      const bx = boat.x * k, by = boat.y * k, r = SEEN_RADIUS * k;
      for (let y = Math.floor(by - r); y <= by + r; y++) {
        for (let x = Math.floor(bx - r); x <= bx + r; x++) {
          // Wrapped like the map, so seeing across an edge marks both sides.
          if ((x - bx) ** 2 + (y - by) ** 2 <= r * r) seen[(((y % CHART) + CHART) % CHART) * CHART + (((x % CHART) + CHART) % CHART)] = 1;
        }
      }
    }

    function drawChart() {
      if (!showChart) return;
      const CHART_X = chartX(), CHART_Y = chartY();
      for (let y = -1; y <= CHART; y++) {
        for (let x = -1; x <= CHART; x++) {
          const edge = x < 0 || y < 0 || x === CHART || y === CHART;
          blendPx(CHART_X + x, CHART_Y + y, edge ? CHART_EDGE : seen[y * CHART + x] ? CHART_SEEN : CHART_DARK);
        }
      }
      // The boat: a small square, with a short line out of it pointing
      // the way it's heading.
      const k = CHART / MAP_SIZE;
      const bx = CHART_X + boat.x * k, by = CHART_Y + boat.y * k;
      for (let i = 2; i <= 3 * S; i++) {
        px(Math.round(bx + Math.sin(boat.heading) * i), Math.round(by - Math.cos(boat.heading) * i), CHART_BOW);
      }
      for (let dy = -1; dy <= 0; dy++) for (let dx = -1; dx <= 0; dx++) px(Math.round(bx) + dx, Math.round(by) + dy, CHART_BOAT);
    }

    // =====================================================================
    // 10. Draw it. The sky gradient only changes when you turn (it's
    //    darker facing away from the sun), so it's saved and only redrawn
    //    when that changes; every frame copies it back and stacks the
    //    moving parts on top — stars, the sun and moon (which turning
    //    swings), clouds in front of them, gulls, the sea, then the speed
    //    bar and chart.
    // =====================================================================
    const SKY_SHADES = 64; // how finely the sky's darkening steps as you turn
    const skyLayer = new Uint32Array(W * HORIZON);
    let skyShade = -1;
    // Puts the sky for the current heading into the frame, redrawing the
    // saved copy first if the heading's moved it to a new shade.
    function paintSky() {
      const away = (1 - Math.cos(boat.heading - SUN_BEARING)) / 2; // 0 facing the sun … 1 facing away
      const shade = Math.round(away * SKY_SHADES);
      if (shade !== skyShade) {
        skyShade = shade;
        drawSky(skyToward(shade / SKY_SHADES));
        shadeClouds(shade / SKY_SHADES);
        skyLayer.set(buf.subarray(0, W * HORIZON));
      } else {
        buf.set(skyLayer);
      }
    }

    // The frame-time readout (F): how long each frame's work takes, in
    // milliseconds — in total, then the sea and the flyer on their own —
    // and the frames per second actually being shown. A frame has about
    // 16.7 ms to finish for a steady 60 fps, so the first number is how
    // much of that budget the scene is using. All smoothed so they're
    // readable rather than flickering.
    let showFrameTime = false;
    let workMs = 0, seaMs = 0, flyerMs = 0, frameGap = 1 / 60;
    const smooth = (avg, now) => avg + (now - avg) * 0.05;
    function drawFrameTime() {
      if (!showFrameTime) return;
      const text = workMs.toFixed(1) + " ms (sea " + seaMs.toFixed(1) + ", flyer " + flyerMs.toFixed(1) + ") · " + Math.round(1 / frameGap) + " fps";
      ctx.font = 6 * S + "px ui-monospace, Consolas, monospace";
      ctx.textBaseline = "top";
      const x = view.left + 4 * S, y = view.top + 4 * S;
      ctx.fillStyle = "rgba(14, 12, 26, 0.75)";
      ctx.fillRect(x - S, y - S, ctx.measureText(text).width + 2 * S, 8 * S);
      ctx.fillStyle = workMs > 12 ? "#ff8a4c" : "#e6eef6"; // orange when getting close to the budget
      ctx.fillText(text, x, y);
    }

    let travel = 0, last = null;
    function frame(ms) {
      requestAnimationFrame(frame);
      const started = performance.now();
      const t = ms / 1000;
      const dt = last === null ? 0 : Math.min(t - last, 0.1); // capped, so a hidden tab doesn't lurch forward
      last = t;
      updateThrottle(t, dt);
      updateSteering(dt);
      boat.heading = (boat.heading + turnRate * dt + 2 * Math.PI) % (2 * Math.PI);
      // How far turning slides everything across the screen this frame
      // (turning right slides the view left).
      const swing = -turnRate * dt * PX_PER_RAD;
      const moved = moveBoat(dt);
      markSeen();
      const f = forwardOf(boat.heading);
      const ahead = moved.x * f.x + moved.y * f.y; // metres gained along the heading
      travel += ahead / (SPEED_1X * TRIP_SECONDS);
      const pace = dt > 0 ? ahead / dt / SPEED_1X : 0; // how fast we're really going, in ×
      // The sun stays at its bearing; it's on screen when the boat faces
      // within the view's width of west.
      sunX = AHEAD_X + wrapAngle(SUN_BEARING - boat.heading) * PX_PER_RAD;
      moonX = AHEAD_X + wrapAngle(MOON_BEARING - boat.heading) * PX_PER_RAD;
      updateClouds(dt, pace, swing, Math.sin(WIND_BEARING - boat.heading));
      paintSky();
      drawStars(t);
      drawSun();
      drawMoon();
      for (const c of clouds) drawCloud(c);
      drawGulls(t); // after the stars, so a star can never twinkle on top of a gull
      const seaStart = performance.now();
      drawSea(travel, swing);
      const flyerStart = performance.now();
      drawFlyer(t);
      seaMs = smooth(seaMs, flyerStart - seaStart);
      flyerMs = smooth(flyerMs, performance.now() - flyerStart);
      drawSpeedBar(t);
      drawChart();
      ctx.putImageData(image, 0, 0);
      // Smoothed timings for the readout (drawn on top, after the pixels).
      workMs = smooth(workMs, performance.now() - started);
      if (dt > 0) frameGap = smooth(frameGap, dt);
      drawFrameTime();
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
